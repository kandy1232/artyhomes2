<style>
/* ============ TOKENS ============ */
:root{
  --navy:#14263f; --navy2:#0e1b2e; --navy3:#1d3252;
  --crimson:#B01E2F; --crimson2:#8f1725;
  --paper:#FAF7F2; --paper2:#F1ECE3; --white:#ffffff;
  --ink:#2B2A28; --muted:#6E6960; --line:#E5DED2; --line2:#d8d0c2;
  --wa:#1f7a4d;
  --serif:'Fraunces',Georgia,serif; --sans:'Archivo',Helvetica,Arial,sans-serif;
  --sh:0 14px 40px rgba(20,38,63,.10);
  --r:2px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--sans);font-size:15.5px;line-height:1.65;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
ul{list-style:none}
button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14.5px;color:var(--ink)}
:focus-visible{outline:2px solid var(--crimson);outline-offset:2px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;flex:none}
.skip{position:absolute;left:-9999px;top:0;background:var(--navy);color:#fff;padding:10px 16px;z-index:300}
.skip:focus{left:8px;top:8px}
.wrap{max-width:1240px;margin:0 auto;padding:0 28px}
@media(max-width:720px){.wrap{padding:0 18px}}
::selection{background:var(--crimson);color:#fff}

/* ============ TYPE & UTILITIES ============ */
h1,h2,h3,h4,.serif{font-family:var(--serif);font-weight:600;line-height:1.14;letter-spacing:-.015em;color:var(--navy)}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:var(--crimson);display:inline-flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:26px;height:2px;background:var(--crimson)}
.sec{padding:92px 0}
@media(max-width:720px){.sec{padding:60px 0}}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:44px;flex-wrap:wrap}
.sec-head h2{font-size:clamp(1.7rem,3vw,2.5rem);margin-top:10px;max-width:640px}
.sec-head .side{font-size:13px;color:var(--muted);max-width:300px;text-align:right}
@media(max-width:720px){.sec-head .side{text-align:left}}
.tlink{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--navy);border-bottom:2px solid var(--crimson);padding-bottom:3px;display:inline-flex;gap:8px;align-items:center;transition:color .2s}
.tlink:hover{color:var(--crimson)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font-size:11.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;padding:15px 28px;border-radius:var(--r);background:var(--navy);color:#fff;border:1.5px solid var(--navy);transition:all .22s;text-align:center}
.btn:hover{background:var(--navy2);transform:translateY(-1px)}
.btn-accent{background:var(--crimson);border-color:var(--crimson)}
.btn-accent:hover{background:var(--crimson2)}
.btn-ghost{background:transparent;color:var(--navy)}
.btn-ghost:hover{background:var(--navy);color:#fff}
.btn-wa{background:transparent;color:var(--wa);border-color:var(--wa)}
.btn-wa:hover{background:var(--wa);color:#fff}
.btn-sm{padding:10px 16px;font-size:10.5px}
.btn-w{background:#fff;color:var(--navy);border-color:#fff}
.btn-w:hover{background:var(--paper);color:var(--navy)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border:1px solid var(--line2);padding:6px 13px;border-radius:99px;color:var(--navy);background:#fff;transition:all .2s}
.chip:hover,.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.muted{color:var(--muted)}
.badge{font-size:9.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;padding:4px 8px;border-radius:2px}
.b-new{background:var(--crimson);color:#fff}
.b-feat{background:var(--navy);color:#fff}

/* ============ HEADER ============ */
#hdr{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);transition:box-shadow .3s}
#hdr.scrolled{box-shadow:0 8px 30px rgba(20,38,63,.08)}
.hdr-in{display:flex;align-items:center;gap:26px;height:74px}
.logo{display:flex;flex-direction:column;line-height:1;flex:none}
.logo img{max-height:46px;width:auto}
.logo-fb{display:flex;flex-direction:column;align-items:flex-start}
.logo-fb svg{height:13px;width:auto}
.logo-fb .wm{font-family:var(--sans);font-weight:700;font-size:19px;letter-spacing:.16em;color:var(--navy)}
.logo-fb .sl{font-family:var(--serif);font-style:italic;font-size:9.5px;color:var(--muted);letter-spacing:.06em;margin-top:2px}
.nav{display:flex;gap:4px;margin-left:14px;flex:1}
.nav-item{position:relative}
.nav-a{display:inline-flex;align-items:center;gap:5px;padding:10px 12px;font-size:13px;font-weight:600;color:var(--navy);border-radius:2px}
.nav-a:hover{color:var(--crimson)}
.nav-a .ic{width:13px;height:13px}
.mega,.dd{position:absolute;left:-20px;top:calc(100% + 1px);background:#fff;border:1px solid var(--line);border-top:2px solid var(--crimson);box-shadow:var(--sh);opacity:0;visibility:hidden;transform:translateY(8px);transition:all .22s;z-index:99}
.mega{width:min(860px,calc(100vw - 56px))}
.dd{width:300px;padding:14px 0}
.nav-item:hover .mega,.nav-item:focus-within .mega,.nav-item:hover .dd,.nav-item:focus-within .dd{opacity:1;visibility:visible;transform:none}
.mega-in{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:34px;padding:30px 34px}
.mega h4,.dd h4{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-family:var(--sans);font-weight:700;margin-bottom:12px}
.mega-list{columns:2;column-gap:26px}
.mega-list a,.dd a{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:5.5px 0;color:var(--navy);break-inside:avoid}
.mega-list a:hover,.dd a:hover{color:var(--crimson)}
.mega-list .n{color:var(--muted);font-size:11.5px}
.mega-cta p{font-size:13px;color:var(--muted);margin:8px 0 16px}
.hdr-acts{display:flex;align-items:center;gap:6px}
.icon-btn{position:relative;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:2px;color:var(--navy);transition:background .2s}
.icon-btn:hover{background:var(--paper2)}
.icon-btn .cnt{position:absolute;top:4px;right:2px;background:var(--crimson);color:#fff;font-size:9px;font-weight:800;min-width:15px;height:15px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.burger{display:none}
@media(max-width:1060px){
  .nav{display:none}.burger{display:inline-flex}
  .hdr-acts .btn{display:none}
}
.drawer{position:fixed;inset:0 0 0 auto;width:min(360px,88vw);background:#fff;z-index:160;transform:translateX(100%);transition:transform .32s cubic-bezier(.7,0,.2,1);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.2)}
.drawer.on{transform:none}
.drawer-hd{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.drawer-bd{overflow-y:auto;padding:10px 22px 40px;flex:1}
.drawer details{border-bottom:1px solid var(--line)}
.drawer summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:15px 0;font-weight:600;font-size:14px;color:var(--navy);cursor:pointer}
.drawer summary::-webkit-details-marker{display:none}
.drawer details a{display:block;padding:7px 0 7px 4px;font-size:13.5px;color:var(--muted)}
.drawer details a:hover{color:var(--crimson)}
.drawer .d2{padding:4px 0 14px;columns:2;column-gap:18px}
.scrim{position:fixed;inset:0;background:rgba(14,27,46,.5);z-index:150;opacity:0;visibility:hidden;transition:.3s}
.scrim.on{opacity:1;visibility:visible}

/* ============ HERO ============ */
.hero{position:relative;height:min(78vh,720px);min-height:480px;background:var(--navy2);overflow:hidden}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1s ease}
.slide.on{opacity:1}
.slide img{width:100%;height:100%;object-fit:cover}
.slide.on img{animation:kb 7.5s ease-out forwards}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.06)}}
.slide::after{content:"";position:absolute;inset:0;background:rgba(14,27,46,.34)}
.hero .wrap{position:relative;height:100%;display:flex;align-items:flex-end;z-index:2}
.hero-copy{background:rgba(14,27,46,.9);color:#fff;max-width:600px;padding:44px 48px;margin-bottom:66px;position:relative}
.hero-copy::before{content:"";position:absolute;left:0;top:0;width:56px;height:4px;background:var(--crimson)}
.hero-copy .eyebrow{color:#e8b7bd}.hero-copy .eyebrow::before{background:var(--crimson)}
.hero-h{font-family:var(--serif);font-size:clamp(1.9rem,4vw,3rem);font-weight:600;color:#fff;margin:12px 0 12px;letter-spacing:-.015em}
.hero-sub{color:#c9d2df;font-size:15.5px;max-width:44ch;margin-bottom:26px}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap}
.hero-nav{position:absolute;right:28px;bottom:66px;display:flex;gap:10px;z-index:3}
.dot{width:44px;text-align:left;color:rgba(255,255,255,.45)}
.dot span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.1em;margin-bottom:5px}
.dot i{display:block;height:2px;background:rgba(255,255,255,.25);font-style:normal}
.dot.on{color:#fff}.dot.on i{background:var(--crimson)}
@media(max-width:720px){.hero-copy{padding:30px 26px;margin:0 18px 60px}.hero-nav{right:18px;bottom:24px}}

/* ============ INTRO / H1 ============ */
.intro-sec{padding:84px 0 66px;text-align:left}
.h1{font-size:clamp(1.9rem,4.4vw,3.3rem);margin:14px 0 6px;max-width:900px}
.h1 .h1b{display:block;font-size:.52em;font-weight:500;color:var(--navy3);margin-top:6px}
.h2-sub{font-size:clamp(1.05rem,1.8vw,1.35rem);font-weight:500;color:var(--crimson);font-family:var(--serif);font-style:italic;margin:2px 0 20px}
.intro-sec .lead{max-width:680px;color:var(--muted);font-size:16.5px;margin-bottom:30px}
.intro-cta{display:flex;gap:12px;flex-wrap:wrap}

/* ============ TRUST BAR ============ */
.trust{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff}
.trust-in{display:flex;flex-wrap:wrap}
.trust-it{flex:1 1 220px;display:flex;gap:14px;align-items:center;padding:22px 26px;border-right:1px solid var(--line)}
.trust-it:last-child{border-right:none}
.trust-it .ic{width:26px;height:26px;color:var(--crimson);stroke-width:1.5}
.trust-it b{display:block;font-size:13.5px;color:var(--navy);font-weight:700}
.trust-it span{font-size:12px;color:var(--muted)}

/* ============ MOSAIC ============ */
.mosaic{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:132px;grid-auto-flow:dense;gap:14px}
.tile{position:relative;overflow:hidden;border-radius:var(--r);background:var(--navy3)}
.tile img{width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.2,.6,.2,1)}
.tile:hover img{transform:scale(1.07)}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(14,27,46,.78) 0%,rgba(14,27,46,.12) 45%,rgba(14,27,46,0) 70%)}
.t-l{grid-column:span 2;grid-row:span 2}.t-w{grid-column:span 2}.t-t{grid-row:span 2}
.tile-meta{position:absolute;left:0;right:0;bottom:0;padding:16px 18px;z-index:2;color:#fff}
.tile-num{font-size:10.5px;font-weight:800;letter-spacing:.2em;color:#e8b7bd;display:block}
.tile-name{font-family:var(--serif);font-size:18px;font-weight:600;display:block;margin:3px 0 2px}
.tile:hover .tile-name{text-decoration:underline;text-decoration-color:var(--crimson);text-decoration-thickness:2px;text-underline-offset:5px}
.t-l .tile-name{font-size:24px}
.tile-count{font-size:11px;color:#b9c4d4;display:block}
@media(max-width:960px){.mosaic{grid-template-columns:repeat(2,1fr);grid-auto-rows:118px}.t-t{grid-row:span 1}.t-l .tile-name{font-size:20px}}

/* ============ PILLS / RAIL / STEPS ============ */
.pills{display:flex;flex-wrap:wrap;gap:10px}
.pill{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line2);background:#fff;padding:11px 20px;border-radius:99px;font-size:13.5px;font-weight:600;color:var(--navy);transition:all .2s}
.pill .n{font-size:11px;color:var(--muted);font-weight:500}
.pill:hover{background:var(--navy);border-color:var(--navy);color:#fff}
.pill:hover .n{color:#aeb9c9}
.rail{display:flex;gap:22px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 6px 22px;cursor:grab;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail>*{scroll-snap-align:start;flex:none}
.rail-btns{display:flex;gap:8px}
.rail-btn{width:42px;height:42px;border:1px solid var(--line2);border-radius:2px;display:inline-flex;align-items:center;justify-content:center;color:var(--navy);background:#fff;transition:.2s}
.rail-btn:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:34px}
.step{border-top:2px solid var(--navy);padding-top:22px;position:relative}
.step::before{content:"";position:absolute;top:-2px;left:0;width:44px;height:2px;background:var(--crimson)}
.step .num{font-family:var(--serif);font-size:44px;font-weight:500;color:var(--crimson);line-height:1}
.step h3{font-size:19px;margin:14px 0 8px}
.step p{font-size:13.5px;color:var(--muted)}
@media(max-width:860px){.steps{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.steps{grid-template-columns:1fr}}

/* ============ BANDS / BANNER / TESTIMONIALS / STRIP ============ */
.band{background:var(--navy);color:#fff}
.banner-custom{display:grid;grid-template-columns:1.1fr .9fr;gap:60px;align-items:center;padding:84px 0}
.banner-custom h2{color:#fff;font-size:clamp(1.7rem,3vw,2.5rem);margin:12px 0 16px}
.banner-custom p{color:#b9c4d4;max-width:52ch;margin-bottom:14px}
.banner-custom .kw{font-size:12.5px;color:#7f8ea6}
.ban-img{position:relative}
.ban-img img{width:100%;height:420px;object-fit:cover}
.ban-img::after{content:"";position:absolute;inset:0;border:2px solid var(--crimson);transform:translate(16px,16px);pointer-events:none}
@media(max-width:860px){.banner-custom{grid-template-columns:1fr;padding:60px 0}.ban-img img{height:260px}}
.tst-wrap{max-width:780px;margin:0 auto;text-align:center;position:relative}
.tst{display:none;animation:fin .5s ease}
.tst.on{display:block}
@keyframes fin{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
.tst .qmark{font-family:var(--serif);font-size:76px;line-height:.6;color:var(--crimson);display:block;margin-bottom:20px}
.tst blockquote{font-family:var(--serif);font-size:clamp(1.25rem,2.4vw,1.75rem);font-weight:500;color:var(--navy);line-height:1.4}
.tst .who{margin-top:24px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--navy)}
.tst .role{font-size:12.5px;color:var(--muted)}
.tst-dots{display:flex;justify-content:center;gap:8px;margin-top:30px}
.tst-dots button{width:8px;height:8px;border-radius:99px;background:var(--line2);transition:.2s}
.tst-dots button.on{background:var(--crimson);width:22px}
.strip-in{display:flex;align-items:center;justify-content:space-between;gap:30px;padding:46px 0;flex-wrap:wrap}
.strip h2{color:#fff;font-size:clamp(1.4rem,2.4vw,1.9rem);margin-bottom:6px}
.strip p{color:#b9c4d4;font-size:13.5px}
.strip-ct{display:flex;gap:26px;flex-wrap:wrap;color:#dfe6ef;font-size:13.5px}
.strip-ct a{display:flex;gap:9px;align-items:center}
.strip-ct a:hover{color:#fff;text-decoration:underline}
.strip-ct .ic{color:var(--crimson)}

/* ============ FAQ / SEO COPY ============ */
.faq{max-width:820px}
.faq details{border-bottom:1px solid var(--line2)}
.faq summary{list-style:none;display:flex;justify-content:space-between;gap:20px;align-items:center;padding:20px 4px;cursor:pointer;font-family:var(--serif);font-size:17.5px;font-weight:600;color:var(--navy)}
.faq summary::-webkit-details-marker{display:none}
.faq summary .pm{flex:none;width:26px;height:26px;border:1.5px solid var(--navy);border-radius:99px;display:inline-flex;align-items:center;justify-content:center;transition:.25s}
.faq summary .pm::before{content:"+";font-family:var(--sans);font-weight:600;font-size:15px;line-height:1}
.faq details[open] summary .pm{background:var(--crimson);border-color:var(--crimson);color:#fff;transform:rotate(45deg)}
.faq .ans{padding:0 4px 22px;color:var(--muted);font-size:14.5px;max-width:64ch}
.faq .ans a{color:var(--crimson);font-weight:600}
.seo-grid{display:grid;grid-template-columns:1.5fr .8fr;gap:56px;align-items:start}
@media(max-width:860px){.seo-grid{grid-template-columns:1fr}}
.seo-copy p{color:#4d4a45;font-size:14.5px;margin-bottom:16px;max-width:70ch}
.seo-copy a{color:var(--crimson);font-weight:600}
.seo-copy h2{font-size:clamp(1.4rem,2.2vw,1.8rem);margin-bottom:18px}
.mini-cta{border:1px solid var(--line2);background:#fff;padding:30px;position:sticky;top:100px}
.mini-cta h3{font-size:20px;margin-bottom:10px}
.mini-cta p{font-size:13px;color:var(--muted);margin-bottom:18px}
.mini-cta .ln{display:flex;gap:10px;align-items:center;font-size:13.5px;font-weight:600;color:var(--navy);padding:8px 0;border-top:1px solid var(--line)}
.mini-cta .ln .ic{color:var(--crimson)}

/* ============ GALLERY ============ */
.fltbar{position:sticky;top:74px;z-index:60;background:var(--paper);border-bottom:1px solid var(--line);padding:14px 0}
.flt-in{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.flt-in select{appearance:none;border:1px solid var(--line2);background:#fff url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M1 1l4 4 4-4" stroke="%2314263f" fill="none" stroke-width="1.5"/></svg>') no-repeat right 12px center;padding:9px 32px 9px 13px;font-size:12.5px;font-weight:600;color:var(--navy);border-radius:2px;cursor:pointer}
.flt-in .srch{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:#fff;padding:0 12px;border-radius:2px}
.flt-in .srch input{border:none;outline:none;padding:9.5px 0;font-size:13px;width:150px;background:transparent}
.swatches{display:flex;align-items:center;gap:7px;margin-left:auto}

function makeDesign(ci,c,id,title){
  const r=k=>h32(id+k);
  const rooms=[...new Set([c.rooms[r('r1')%c.rooms.length],c.rooms[r('r2')%c.rooms.length],c.rooms[r('r3')%c.rooms.length]])];
  const isPeel=c.s==='peel-and-stick-wallpaper-sri-lanka', isCustom=c.s==='custom-wallpaper-sri-lanka';
  const type=isPeel?'peel-stick':isCustom?'custom-mural':['ready-made-roll','ready-made-roll','custom-mural','ready-made-roll','peel-stick'][r('t')%5];
  const mats=['vinyl','non-woven','textured','washable'];
  const material=isPeel?'vinyl':mats[r('m')%4];
  const colours=[...new Set([c.colours[r('c1')%c.colours.length],c.colours[(r('c2')+1)%c.colours.length]])];
  const ph=r('p');
  const price=(isCustom?(ph%2===0?null:280+(ph%28)*10):(ph%3===0?null:180+(ph%48)*10));
  const hh=[700,760,820,900,960,1020,860,740][r('a')%8];
  return{id,slug:slugify(title),title,cat:ci,catName:c.n,catSlug:c.s,type,material,rooms,colours,price,
    desc:`${title} — ${c.n.toLowerCase()} wallpaper printed in Sri Lanka to your exact wall size. Supplied on ${MATS[material]} as ${TYPES[type].toLowerCase()}, with colour-matched samples, island-wide delivery and Colombo installation support.`,
    alt:`${title} – ${c.n} wallpaper Sri Lanka | ARTYHOMES custom wall murals`,
    featured:FEATURED.has(id),isNew:r('n')%7===0,pop:20+r('o')%80,
    date:NOW-(r('d')%180)*DAY-(r('d2')%12)*36e5,
    seed:'ah-'+id,w:600,h:hh,sizes:SIZES};
}

  return{path:(qi>-1?h.slice(0,qi):h).replace(/\/+$/,'')||'/',q:new URLSearchParams(qs)}}
function route(){
